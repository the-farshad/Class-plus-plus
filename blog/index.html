<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2563eb" />
  <title>Class++ — Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800&family=Lora:wght@400;500;600&family=Ubuntu:wght@400;500;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css?v=85" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <header class="site">
    <div class="inner">
      <a class="brand" href="/">
        <span class="brand-mark">C++</span>
        <span class="brand-name">Class++</span>
      </a>

      <nav class="primary-nav" aria-label="Primary navigation">
        <a href="/" id="nav-submit" class="nav-link">
          <i data-lucide="zap"></i><span>Live</span>
        </a>
        <a href="/blog/" id="nav-notes" class="nav-link nav-active">
          <i data-lucide="book-open"></i><span>Notes</span>
        </a>
        <a href="/instructor/" id="nav-admin" class="nav-link" hidden>
          <i data-lucide="layout-dashboard"></i><span>Dashboard</span>
        </a>
      </nav>

      <div class="nav-actions">
        <a id="nav-signin" class="signin-cta" href="/" hidden>
          <i data-lucide="log-in"></i> Sign in
        </a>
        <button id="btn-settings" class="user-pill" aria-label="Theme settings" aria-haspopup="dialog" aria-expanded="false">
          <span class="user-avatar" id="user-avatar" aria-hidden="true">?</span>
          <span class="user-meta">
            <span class="user-email" id="user-pill-email">Guest</span>
            <span class="user-role">Theme</span>
          </span>
          <i data-lucide="chevron-down" class="user-pill-chev"></i>
        </button>
      </div>
    </div>
  </header>

  <script type="module">
    import { api } from "/js/api.js?v=85";
    api.initTheme();
    document.getElementById("nav-notes")?.classList.add("nav-active");
  </script>

  <main>
    <div class="hero">
      <h1>Course Notes</h1>
      <p>Weekly concept write-ups, examples, and study guides for C++. <span id="notes-count" class="muted" style="font-size:0.85rem;"></span></p>
    </div>

    <section class="card">
      <div class="blog-toolbar">
        <label class="blog-field" style="flex:2;">
          <span class="sr-only">Search notes</span>
          <input type="search" id="post-search" placeholder="Search title or summary…" autocomplete="off" />
        </label>
        <label class="blog-field" style="flex:0 0 auto;min-width:130px;">
          <span class="muted blog-field-label">Topic</span>
          <select id="tag-filter">
            <option value="">All topics</option>
          </select>
        </label>
        <label class="blog-field" style="flex:0 0 auto;min-width:130px;">
          <span class="muted blog-field-label">Sort</span>
          <select id="post-sort">
            <option value="week">Week order</option>
            <option value="date">Newest first</option>
            <option value="title">Title A–Z</option>
          </select>
        </label>
      </div>

      <ul id="post-list" class="activity-list post-list" style="margin-top:0.25rem;"></ul>

      <div id="pagination" class="pagination"></div>

      <p id="no-results" class="muted" style="padding:2rem 0;display:none;">
        No notes match your filters. <button class="secondary sm" id="clear-search" style="margin-left:0.5rem;">Clear</button>
      </p>
    </section>
    <div class="build-chip" data-version></div>
  </main>

  <script type="module">
    import { renderIndex } from "/js/blog.js?v=85";
    renderIndex(document.getElementById("post-list"), {
      searchEl:     document.getElementById("post-search"),
      sortEl:       document.getElementById("post-sort"),
      tagFilterEl:  document.getElementById("tag-filter"),
      countEl:      document.getElementById("notes-count"),
      noResults:    document.getElementById("no-results"),
      clearBtn:     document.getElementById("clear-search"),
      paginationEl: document.getElementById("pagination"),
    });
  </script>
  <div id="modal-overlay-settings" class="modal-overlay" hidden></div>
  <div id="modal-settings" class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-settings-title" hidden>
    <div class="modal-panel-header">
      <span id="modal-settings-title" style="font-weight:700;font-size:0.95rem;">Settings</span>
      <button id="close-settings" class="icon-btn" aria-label="Close"><i data-lucide="x" style="width:16px;height:16px;"></i></button>
    </div>
    <div class="modal-panel-body">
      <div class="settings-row">
        <label class="settings-label" for="theme-selector"><i data-lucide="palette" style="width:15px;height:15px;"></i> Theme</label>
        <select id="theme-selector" class="settings-select">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
          <option value="uwyo">UWYO</option>
          <option value="sepia">Sepia</option>
          <option value="high-contrast">High Contrast</option>
        </select>
      </div>
    </div>
  </div>

  <script type="module">
    import { bootPage, mountSettingsDrawer } from "/js/ui.js?v=85";
    import { api, session } from "/js/api.js?v=85";
    bootPage();
    mountSettingsDrawer({ api, session });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Class++ — Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800&family=Lora:wght@400;500;600&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <header class="site">
    <div class="inner">
      <a class="brand" href="/">
        <span class="brand-mark">C++</span>
        <span>Class<span style="color: var(--brand-1)">++</span></span>
        <span class="brand-tag">Notes</span>
      </a>
      <nav style="align-items: center; gap: 1rem;">
        <a href="/">Submit</a>
        <a href="/blog/">Notes</a>
        <div class="theme-selector-wrapper">
          <i data-lucide="palette" style="width: 16px; height: 16px; color: var(--muted);"></i>
          <select id="theme-selector" class="theme-dropdown">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
            <option value="uwyo">UWYO</option>
            <option value="sepia">Sepia</option>
            <option value="high-contrast">High Contrast</option>
          </select>
        </div>
      </nav>
    </div>
  </header>
  
  <script type="module">
    import { api } from "/js/api.js";
    api.initTheme();
    const selector = document.getElementById("theme-selector");
    selector.value = document.documentElement.getAttribute("data-theme") || "light";
    selector.addEventListener("change", (e) => api.setTheme(e.target.value));
  </script>

  <main>
    <div class="hero">
      <h1>Class notes</h1>
      <p>Solution write-ups, lesson recaps, and follow-up explanations.</p>
    </div>
    <section class="card">
      <div class="blog-toolbar">
        <label class="blog-field">
          <span class="sr-only">Search notes</span>
          <input type="search" id="post-search" placeholder="Search title, summary, tags…" autocomplete="off" />
        </label>
        <label class="blog-field">
          <span class="muted blog-field-label">Sort</span>
          <select id="post-sort">
            <option value="date">Newest first</option>
            <option value="week">Week order (course)</option>
            <option value="title">Title A–Z</option>
          </select>
        </label>
      </div>
      <ul id="post-list" class="activity-list"></ul>
    </section>
  </main>
  
  <script type="module">
    import { renderIndex } from "/js/blog.js";
    renderIndex(document.getElementById("post-list"), {
      searchEl: document.getElementById("post-search"),
      sortEl: document.getElementById("post-sort"),
    });
  </script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>

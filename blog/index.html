<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2563eb" />
  <title>Class++ — Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800&family=Lora:wght@400;500;600&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <header class="site">
    <div class="inner">
      <a class="brand" href="/">
        <span class="brand-mark">C++</span>
        <span>Class<span style="color:var(--brand-1)">++</span></span>
        <span class="brand-tag">Notes</span>
      </a>
      <nav>
        <a href="/" id="nav-submit">Submit</a>
        <a href="/blog/" id="nav-notes">Notes</a>
        <div class="theme-selector-wrapper">
          <i data-lucide="palette" style="width:15px;height:15px;color:var(--muted);flex-shrink:0;"></i>
          <select id="theme-selector" class="theme-dropdown">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
            <option value="uwyo">UWYO</option>
            <option value="sepia">Sepia</option>
            <option value="high-contrast">High Contrast</option>
          </select>
        </div>
      </nav>
    </div>
  </header>

  <script type="module">
    import { api } from "/js/api.js";
    api.initTheme();
    const sel = document.getElementById("theme-selector");
    sel.value = document.documentElement.getAttribute("data-theme") || "light";
    sel.addEventListener("change", e => api.setTheme(e.target.value));
    document.getElementById("nav-notes")?.classList.add("nav-active");
  </script>

  <main>
    <div class="hero">
      <h1>Course Notes</h1>
      <p>Weekly concept write-ups, examples, and study guides for C++.</p>
      <p id="notes-count" class="muted" style="margin-top:0.5rem;font-size:0.85rem;"></p>
    </div>

    <section class="card">
      <div class="blog-toolbar">
        <label class="blog-field">
          <span class="sr-only">Search notes</span>
          <input type="search" id="post-search" placeholder="Search title, summary, tags…" autocomplete="off" />
        </label>
        <label class="blog-field" style="flex:0 0 auto;min-width:140px;">
          <span class="muted blog-field-label">Sort by</span>
          <select id="post-sort">
            <option value="week">Week order</option>
            <option value="date">Newest first</option>
            <option value="title">Title A–Z</option>
          </select>
        </label>
      </div>

      <div id="tag-chips" class="tag-chips"></div>

      <ul id="post-list" class="activity-list" style="margin-top:0.5rem;"></ul>

      <p id="no-results" class="muted" style="text-align:center;padding:2rem 0;display:none;">
        No notes match your search. <button class="secondary sm" id="clear-search" style="margin-left:0.5rem;">Clear filters</button>
      </p>
    </section>
  </main>

  <footer class="site">
    <div class="inner">
      <a class="footer-brand" href="/">
        <span class="footer-brand-mark">C++</span>
        Class++
      </a>
      <nav class="footer-links">
        <a href="/">Submit</a>
        <a href="/blog/">Notes</a>
        <a href="/instructor/">Instructor</a>
      </nav>
      <span class="footer-copy">© 2026 Class++. University of Wyoming.</span>
    </div>
  </footer>

  <script type="module">
    import { renderIndex } from "/js/blog.js";
    renderIndex(document.getElementById("post-list"), {
      searchEl:  document.getElementById("post-search"),
      sortEl:    document.getElementById("post-sort"),
      chipsEl:   document.getElementById("tag-chips"),
      countEl:   document.getElementById("notes-count"),
      noResults: document.getElementById("no-results"),
      clearBtn:  document.getElementById("clear-search"),
    });
  </script>
  <script>lucide.createIcons();</script>
</body>
</html>

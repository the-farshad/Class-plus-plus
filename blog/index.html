<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2563eb" />
  <title>Class++ — Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800&family=Lora:wght@400;500;600&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <header class="site">
    <div class="inner">
      <a class="brand" href="/">
        <span class="brand-mark">C++</span>
        <span>Class++</span>
        <span class="brand-tag">Notes</span>
      </a>
      <nav>
        <a href="/" id="nav-submit">Submit</a>
        <a href="/blog/" id="nav-notes">Notes</a>
        <button id="btn-settings" class="icon-btn" title="Theme" aria-label="Theme settings">
          <i data-lucide="settings" style="width:17px;height:17px;"></i>
        </button>
      </nav>
    </div>
  </header>

  <script type="module">
    import { api } from "/js/api.js";
    api.initTheme();
    document.getElementById("nav-notes")?.classList.add("nav-active");
  </script>

  <main>
    <div class="hero">
      <h1>Course Notes</h1>
      <p>Weekly concept write-ups, examples, and study guides for C++. <span id="notes-count" class="muted" style="font-size:0.85rem;"></span></p>
    </div>

    <section class="card">
      <div class="blog-toolbar">
        <label class="blog-field" style="flex:2;">
          <span class="sr-only">Search notes</span>
          <input type="search" id="post-search" placeholder="Search title or summary…" autocomplete="off" />
        </label>
        <label class="blog-field" style="flex:0 0 auto;min-width:130px;">
          <span class="muted blog-field-label">Topic</span>
          <select id="tag-filter">
            <option value="">All topics</option>
          </select>
        </label>
        <label class="blog-field" style="flex:0 0 auto;min-width:130px;">
          <span class="muted blog-field-label">Sort</span>
          <select id="post-sort">
            <option value="week">Week order</option>
            <option value="date">Newest first</option>
            <option value="title">Title A–Z</option>
          </select>
        </label>
      </div>

      <ul id="post-list" class="activity-list" style="margin-top:0.25rem;"></ul>

      <p id="no-results" class="muted" style="padding:2rem 0;display:none;">
        No notes match your filters. <button class="secondary sm" id="clear-search" style="margin-left:0.5rem;">Clear</button>
      </p>
    </section>
  </main>

  <footer class="site">
    <div class="inner">
      <a class="footer-brand" href="/">
        <span class="footer-brand-mark">C++</span>
        Class++
      </a>
      <nav class="footer-links">
        <a href="/">Submit</a>
        <a href="/blog/">Notes</a>
        <a href="/instructor/">Instructor</a>
      </nav>
      <span class="footer-copy">© 2026 Class++. University of Wyoming.</span>
    </div>
  </footer>

  <script type="module">
    import { renderIndex } from "/js/blog.js";
    renderIndex(document.getElementById("post-list"), {
      searchEl:     document.getElementById("post-search"),
      sortEl:       document.getElementById("post-sort"),
      tagFilterEl:  document.getElementById("tag-filter"),
      countEl:      document.getElementById("notes-count"),
      noResults:    document.getElementById("no-results"),
      clearBtn:     document.getElementById("clear-search"),
    });
  </script>
  <div id="modal-overlay-settings" class="modal-overlay" hidden></div>
  <div id="modal-settings" class="modal-panel" hidden>
    <div class="modal-panel-header">
      <span style="font-weight:700;font-size:0.95rem;">Settings</span>
      <button id="close-settings" class="icon-btn" aria-label="Close"><i data-lucide="x" style="width:16px;height:16px;"></i></button>
    </div>
    <div class="modal-panel-body">
      <div class="settings-row">
        <label class="settings-label" for="theme-selector"><i data-lucide="palette" style="width:15px;height:15px;"></i> Theme</label>
        <select id="theme-selector" class="settings-select">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
          <option value="uwyo">UWYO</option>
          <option value="sepia">Sepia</option>
          <option value="high-contrast">High Contrast</option>
        </select>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();
    (function () {
      const btn = document.getElementById("btn-settings");
      const modal = document.getElementById("modal-settings");
      const overlay = document.getElementById("modal-overlay-settings");
      const close = document.getElementById("close-settings");
      const sel = document.getElementById("theme-selector");

      import("/js/api.js").then(({ api }) => {
        api.initTheme();
        sel.value = document.documentElement.getAttribute("data-theme") || "light";
        sel.addEventListener("change", () => api.setTheme(sel.value));
      });

      function open() { sel.value = document.documentElement.getAttribute("data-theme") || "light"; modal.hidden = false; overlay.hidden = false; }
      function closeM() { modal.hidden = true; overlay.hidden = true; }
      btn.addEventListener("click", open);
      close.addEventListener("click", closeM);
      overlay.addEventListener("click", closeM);
      document.addEventListener("keydown", e => { if (e.key === "Escape") closeM(); });
    })();
  </script>
</body>
</html>

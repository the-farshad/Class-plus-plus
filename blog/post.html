<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2563eb" />
  <title>Class++ — Note</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800&family=Lora:wght@400;500;600&family=Ubuntu:wght@400;500;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css?v=78" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Prism: VS Code Dark+ community theme + line-numbers plugin (CSS first, JS deferred) -->
  <link href="https://cdn.jsdelivr.net/npm/prism-themes@1.9.0/themes/prism-vsc-dark-plus.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/line-numbers/prism-line-numbers.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js" defer></script>
  <!-- Order matters: prism-c must load before prism-cpp because cpp does
       Prism.languages.extend('c', ...) — without c loaded first that
       extend silently fails and cpp never registers, so code stays plain. -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-c.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-cpp.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/line-numbers/prism-line-numbers.min.js" defer></script>
</head>
<body>

  <!-- Reading progress bar -->
  <div class="reading-progress" id="reading-progress"></div>

  <header class="site">
    <div class="inner">
      <a class="brand" href="/">
        <span class="brand-mark">C++</span>
        <span class="brand-name">Class++</span>
      </a>

      <nav class="primary-nav" aria-label="Primary navigation">
        <a href="/" id="nav-submit" class="nav-link">
          <i data-lucide="zap"></i><span>Live</span>
        </a>
        <a href="/blog/" id="nav-notes" class="nav-link nav-active">
          <i data-lucide="book-open"></i><span>Notes</span>
        </a>
        <a href="/instructor/" id="nav-admin" class="nav-link" hidden>
          <i data-lucide="layout-dashboard"></i><span>Dashboard</span>
        </a>
      </nav>

      <div class="nav-actions">
        <a id="nav-signin" class="signin-cta" href="/" hidden>
          <i data-lucide="log-in"></i> Sign in
        </a>
        <button id="btn-settings" class="user-pill" aria-label="Theme settings" aria-haspopup="dialog" aria-expanded="false">
          <span class="user-avatar" id="user-avatar" aria-hidden="true">?</span>
          <span class="user-meta">
            <span class="user-email" id="user-pill-email">Guest</span>
            <span class="user-role">Theme</span>
          </span>
          <i data-lucide="chevron-down" class="user-pill-chev"></i>
        </button>
      </div>
    </div>
  </header>

  <script type="module">
    import { api } from "/js/api.js?v=78";
    api.initTheme();
    document.getElementById("nav-notes")?.classList.add("nav-active");
  </script>

  <article class="post-article">
    <a href="/blog/" class="post-back-link">
      <i data-lucide="arrow-left" style="width:15px;height:15px;"></i>
      All notes
    </a>
    <div id="post" class="post-content">
      <!-- Skeleton while loading -->
      <div id="post-skeleton">
        <div class="skeleton skeleton-line" style="width:60%;height:1.8rem;margin-bottom:1rem;"></div>
        <div class="skeleton skeleton-line wide" style="height:0.9rem;margin-bottom:0.5rem;"></div>
        <div class="skeleton skeleton-line medium" style="height:0.9rem;margin-bottom:0.5rem;"></div>
        <div class="skeleton skeleton-line" style="width:80%;height:0.9rem;margin-bottom:2rem;"></div>
        <div class="skeleton skeleton-line wide" style="height:0.9rem;margin-bottom:0.5rem;"></div>
        <div class="skeleton skeleton-line short" style="height:0.9rem;"></div>
      </div>
    </div>
    <div class="build-chip" data-version></div>
  </article>

  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script type="module">
    import { renderPost } from "/js/blog.js?v=78";
    renderPost(document.getElementById("post"));
  </script>

  <div id="modal-overlay-settings" class="modal-overlay" hidden></div>
  <div id="modal-settings" class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-settings-title" hidden>
    <div class="modal-panel-header">
      <span id="modal-settings-title" style="font-weight:700;font-size:0.95rem;">Settings</span>
      <button id="close-settings" class="icon-btn" aria-label="Close"><i data-lucide="x" style="width:16px;height:16px;"></i></button>
    </div>
    <div class="modal-panel-body">
      <div class="settings-row">
        <label class="settings-label" for="theme-selector"><i data-lucide="palette" style="width:15px;height:15px;"></i> Theme</label>
        <select id="theme-selector" class="settings-select">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
          <option value="uwyo">UWYO</option>
          <option value="sepia">Sepia</option>
          <option value="high-contrast">High Contrast</option>
        </select>
      </div>
    </div>
  </div>

  <script type="module">
    import { bootPage, mountSettingsDrawer } from "/js/ui.js?v=78";
    import { api, session } from "/js/api.js?v=78";
    bootPage();
    mountSettingsDrawer({ api, session });
  </script>
  <script>
    // Reading progress bar
    const bar = document.getElementById("reading-progress");
    window.addEventListener("scroll", () => {
      const doc = document.documentElement;
      const scrolled = doc.scrollTop / (doc.scrollHeight - doc.clientHeight);
      bar.style.width = Math.min(100, scrolled * 100) + "%";
    }, { passive: true });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2563eb" />
  <title>Class++ — Note</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800&family=Lora:wght@400;500;600&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Prism.js for C++ syntax highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-cpp.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-c.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js" defer></script>
</head>
<body>

  <!-- Reading progress bar -->
  <div class="reading-progress" id="reading-progress"></div>

  <header class="site">
    <div class="inner">
      <a class="brand" href="/">
        <span class="brand-mark">C++</span>
        <span>Class++</span>
        <span class="brand-tag">Notes</span>
      </a>
      <nav>
        <a href="/" id="nav-submit">Submit</a>
        <a href="/blog/" id="nav-notes">Notes</a>
        <button id="btn-settings" class="icon-btn" title="Theme" aria-label="Theme settings">
          <i data-lucide="settings" style="width:17px;height:17px;"></i>
        </button>
      </nav>
    </div>
  </header>

  <script type="module">
    import { api } from "/js/api.js";
    api.initTheme();
    document.getElementById("nav-notes")?.classList.add("nav-active");
  </script>

  <article class="post-article">
    <a href="/blog/" class="post-back-link">
      <i data-lucide="arrow-left" style="width:15px;height:15px;"></i>
      All notes
    </a>
    <div id="post" class="post-content">
      <!-- Skeleton while loading -->
      <div id="post-skeleton">
        <div class="skeleton skeleton-line" style="width:60%;height:1.8rem;margin-bottom:1rem;"></div>
        <div class="skeleton skeleton-line wide" style="height:0.9rem;margin-bottom:0.5rem;"></div>
        <div class="skeleton skeleton-line medium" style="height:0.9rem;margin-bottom:0.5rem;"></div>
        <div class="skeleton skeleton-line" style="width:80%;height:0.9rem;margin-bottom:2rem;"></div>
        <div class="skeleton skeleton-line wide" style="height:0.9rem;margin-bottom:0.5rem;"></div>
        <div class="skeleton skeleton-line short" style="height:0.9rem;"></div>
      </div>
    </div>
  </article>

  <footer class="site">
    <div class="inner">
      <a class="footer-brand" href="/">
        <span class="footer-brand-mark">C++</span>
        Class++
      </a>
      <nav class="footer-links">
        <a href="/">Submit</a>
        <a href="/blog/">Notes</a>
        <a href="/instructor/">Instructor</a>
      </nav>
      <span class="footer-copy">© 2026 Class++. University of Wyoming.</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script type="module">
    import { renderPost } from "/js/blog.js";
    renderPost(document.getElementById("post"));
  </script>

  <div id="modal-overlay-settings" class="modal-overlay" hidden></div>
  <div id="modal-settings" class="modal-panel" hidden>
    <div class="modal-panel-header">
      <span style="font-weight:700;font-size:0.95rem;">Settings</span>
      <button id="close-settings" class="icon-btn" aria-label="Close"><i data-lucide="x" style="width:16px;height:16px;"></i></button>
    </div>
    <div class="modal-panel-body">
      <div class="settings-row">
        <label class="settings-label" for="theme-selector"><i data-lucide="palette" style="width:15px;height:15px;"></i> Theme</label>
        <select id="theme-selector" class="settings-select">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
          <option value="uwyo">UWYO</option>
          <option value="sepia">Sepia</option>
          <option value="high-contrast">High Contrast</option>
        </select>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();
    (function () {
      const btn = document.getElementById("btn-settings");
      const modal = document.getElementById("modal-settings");
      const overlay = document.getElementById("modal-overlay-settings");
      const close = document.getElementById("close-settings");
      const sel = document.getElementById("theme-selector");

      import("/js/api.js").then(({ api }) => {
        api.initTheme();
        sel.value = document.documentElement.getAttribute("data-theme") || "light";
        sel.addEventListener("change", () => api.setTheme(sel.value));
      });

      function openM() { sel.value = document.documentElement.getAttribute("data-theme") || "light"; modal.hidden = false; overlay.hidden = false; }
      function closeM() { modal.hidden = true; overlay.hidden = true; }
      btn.addEventListener("click", openM);
      close.addEventListener("click", closeM);
      overlay.addEventListener("click", closeM);
      document.addEventListener("keydown", e => { if (e.key === "Escape") closeM(); });
    })();

    // Reading progress bar
    const bar = document.getElementById("reading-progress");
    window.addEventListener("scroll", () => {
      const doc = document.documentElement;
      const scrolled = doc.scrollTop / (doc.scrollHeight - doc.clientHeight);
      bar.style.width = Math.min(100, scrolled * 100) + "%";
    }, { passive: true });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Class++ — Present</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Roboto+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css?v=90" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Markdown rendering for the activity prompt -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>
  <style>
    /* Presentation mode lives outside the normal site chrome — full-screen,
       dark theme, huge typography, optimized for a projector at the back
       of the lecture hall. Everything is sized in vw/vh so it scales with
       the projector resolution. */
    body.present-body {
      margin: 0;
      min-height: 100vh;
      background: #0b0f17;
      color: #f5f7fa;
      font-family: "Inter", system-ui, sans-serif;
      overflow: hidden;
    }
    .present-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: clamp(1.5rem, 3vw, 3rem);
      gap: clamp(1rem, 2.5vh, 2rem);
    }
    .present-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }
    .present-mark {
      font-family: "Roboto Mono", monospace;
      font-weight: 700;
      font-size: clamp(1rem, 1.4vw, 1.4rem);
      color: #93a3b8;
      letter-spacing: -0.02em;
    }
    .present-mark strong { color: #60a5fa; }
    .present-meta {
      display: flex;
      gap: 0.8rem;
      align-items: center;
      font-size: clamp(0.85rem, 1.1vw, 1.05rem);
      color: #93a3b8;
    }
    .present-pill {
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      background: rgba(96, 165, 250, 0.13);
      color: #93c5fd;
      border: 1px solid rgba(96, 165, 250, 0.3);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .present-pill.live { background: rgba(34, 197, 94, 0.12); color: #86efac; border-color: rgba(34, 197, 94, 0.35); }
    .present-pill.live::before { content: "●"; margin-right: 0.45rem; color: #22c55e; animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    .present-toggle {
      font: inherit;
      font-size: clamp(0.78rem, 1vw, 0.95rem);
      font-weight: 600;
      padding: 0.32rem 0.75rem;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.08);
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.25);
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .present-toggle:hover { background: rgba(148, 163, 184, 0.16); color: #f1f5f9; }
    .present-chart-picker {
      display: inline-flex;
      gap: 0.25rem;
      padding: 0.2rem;
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.06);
    }
    .present-chart-picker button {
      appearance: none;
      font: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.28rem 0.65rem;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .present-chart-picker button:hover { color: #f1f5f9; }
    .present-chart-picker button.active {
      background: rgba(96, 165, 250, 0.25);
      color: #dbeafe;
    }

    .present-prompt {
      font-size: clamp(1.6rem, 2.6vw, 2.6rem);
      font-weight: 700;
      line-height: 1.25;
      color: #f8fafc;
      letter-spacing: -0.02em;
      max-width: 90ch;
    }
    .present-prompt p { margin: 0 0 0.6em; }
    .present-prompt p:last-child { margin-bottom: 0; }
    .present-prompt code {
      background: rgba(96, 165, 250, 0.14);
      color: #93c5fd;
      padding: 0.05em 0.35em;
      border-radius: 6px;
      font-size: 0.85em;
    }
    .present-prompt pre {
      background: #0a0e16;
      border: 1px solid rgba(148, 163, 184, 0.18);
      padding: 0.85rem 1rem;
      border-radius: 10px;
      overflow: auto;
      font-size: 0.6em;
    }
    .present-prompt pre code { background: transparent; color: inherit; padding: 0; }

    .present-chart-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      position: relative;
    }
    .present-chart-wrap canvas { max-width: 100%; max-height: 100%; }

    /* For non-chart types we render a big card stack instead. */
    .present-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
      width: 100%;
      max-height: 100%;
      overflow: auto;
    }
    .present-list-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 12px;
      padding: 1rem 1.2rem;
      font-size: clamp(1rem, 1.3vw, 1.25rem);
      color: #e2e8f0;
      animation: fadeIn 0.5s ease both;
    }
    .present-list-card .who {
      font-size: 0.78em;
      color: #64748b;
      font-family: "Roboto Mono", monospace;
      margin-bottom: 0.45rem;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .present-bottombar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: clamp(0.78rem, 1vw, 0.95rem);
      color: #475569;
    }
    .present-bottombar kbd {
      font-family: "Roboto Mono", monospace;
      background: rgba(148, 163, 184, 0.12);
      border: 1px solid rgba(148, 163, 184, 0.25);
      padding: 0.12rem 0.4rem;
      border-radius: 5px;
      color: #cbd5e1;
      font-size: 0.85em;
    }

    .present-error {
      max-width: 520px;
      margin: 18vh auto 0;
      text-align: center;
      color: #f87171;
    }
    .present-error h1 { color: #f8fafc; font-size: 1.6rem; margin: 0 0 0.6rem; }
    .present-error a { color: #93c5fd; }

    /* Hide the site nav/header that styles.css usually mounts. */
    header.site, footer.site, .build-chip { display: none !important; }
  </style>
</head>
<body class="present-body">
  <div class="present-shell" id="shell" hidden>
    <div class="present-topbar">
      <div class="present-mark"><strong>C++</strong>&nbsp;&nbsp;Class++ · Present mode</div>
      <div class="present-meta">
        <!-- Chart-type picker. Populated by JS based on activity type;
             hidden for non-chart activities (word_cloud / ordering / submission). -->
        <div id="chart-picker" class="present-chart-picker" hidden></div>
        <!-- Identity toggle: cycles full → anonymized → hidden. Press A. -->
        <button id="identity-toggle" class="present-toggle" title="Who answered (A to cycle)">
          <span id="identity-label">Anonymized</span>
        </button>
        <span id="status-pill" class="present-pill live">Live</span>
        <span id="count-pill" class="present-pill">0 responses</span>
      </div>
    </div>
    <div id="prompt" class="present-prompt"></div>
    <div class="present-chart-wrap">
      <canvas id="chart" hidden></canvas>
      <div id="list" class="present-list" hidden></div>
      <div id="empty-state" style="color:#64748b;font-size:1.1rem;" hidden>No responses yet.</div>
    </div>
    <div class="present-bottombar">
      <span><kbd>F</kbd> fullscreen · <kbd>R</kbd> refresh · <kbd>A</kbd> identity · <kbd>1</kbd>–<kbd>6</kbd> chart · <kbd>Esc</kbd> exit</span>
      <span id="updated-at"></span>
    </div>
  </div>
  <div id="error-screen" class="present-error" hidden>
    <h1 id="error-title">Activity not available</h1>
    <p id="error-body" class="muted">Make sure you're signed in as an instructor on this browser.</p>
    <p><a href="/instructor/">Go to the dashboard →</a></p>
  </div>
  <script type="module" src="/js/present.js?v=90"></script>
</body>
</html>
